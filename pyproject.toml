[tool.coverage.run]
source = ["aws_lambda_powertools"]
omit = [
  "*/tests/*",
  "*/aws_lambda_powertools/exceptions/*",
  "*/aws_lambda_powertools/utilities/parser/types.py",
  "*/aws_lambda_powertools/utilities/jmespath_utils/envelopes.py",
  "*/aws_lambda_powertools/metrics/metric.py"  # barrel import (export-only)
]
branch = true
# pytest-cov 7 delegates subprocess measurement to coverage.py.
patch = ["subprocess"]

[tool.coverage.html]
directory = "test_report"
title = "Powertools for AWS Lambda (Python) Test Coverage"

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  # Have to re-enable the standard pragma
  "pragma: no cover",

  # Don't complain about missing debug-only code:
  "def __repr__",
  "if self.debug",

  # Don't complain if tests don't hit defensive assertion code:
  "raise AssertionError",
  "raise NotImplementedError",

  # Don't complain if non-runnable code isn't run:
  "if 0:",
  "if __name__ == .__main__.:",

  # Ignore runtime type checking
  "if TYPE_CHECKING:",

  # Ignore type function overload
  "@overload",
]

[tool.isort]
profile = "black" # resolves conflict with black
skip = "example"

[tool.black]
line-length = 120
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | aws_lambda_powertools/event_handler/openapi/compat.py
  )/
  | example
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -vv"
testpaths = "./tests"
markers = [
  "perf: marks perf tests to be deselected (deselect with '-m \"not perf\"')",
]

[tool.ty]
# ty type checker configuration
# Ignore unused type: ignore comments since we also run mypy which may need them
[tool.ty.rules]
unused-type-ignore-comment = "ignore"

[tool.ty.src]
include = ["aws_lambda_powertools/**"]
exclude = [
    "tests/**",
    "examples/**",
    "docs/**",
    # Baseline exclusions - modules with existing diagnostics (issue #7927)
    # These will be addressed incrementally in follow-up PRs
    "aws_lambda_powertools/logging/**",
    "aws_lambda_powertools/utilities/validation/**",
    "aws_lambda_powertools/shared/**",
    "aws_lambda_powertools/metrics/**",
    "aws_lambda_powertools/middleware_factory/**",
    "aws_lambda_powertools/utilities/streaming/**",
    "aws_lambda_powertools/utilities/data_masking/**",
    "aws_lambda_powertools/tracing/**",
    "aws_lambda_powertools/utilities/batch/**",
    "aws_lambda_powertools/utilities/idempotency/**",
    "aws_lambda_powertools/utilities/parameters/**",
    "aws_lambda_powertools/event_handler/**",
]

[tool.hatch.build.targets.wheel]
packages = ["aws_lambda_powertools"]

[tool.hatch.build.targets.sdist]
include = ["/aws_lambda_powertools", "/README.md", "/LICENSE", "/THIRD-PARTY-LICENSES"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
