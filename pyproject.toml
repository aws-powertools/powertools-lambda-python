[project]
name = "aws_lambda_powertools"
version = "3.24.0"
description = "Powertools for AWS Lambda (Python) is a developer toolkit to implement Serverless best practices and increase developer velocity."
authors = [{ name = "Amazon Web Services" }]
readme = "README.md"
license = "MIT-0"
requires-python = ">=3.10,<4.0.0"
keywords = [
  "aws_lambda_powertools",
  "aws",
  "tracing",
  "logging",
  "lambda",
  "powertools",
  "feature_flags",
  "idempotency",
  "middleware",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

dependencies = [
  "jmespath>=1.0.1,<2.0.0",
  "typing-extensions>=4.11.0,<5.0.0",
]

[project.optional-dependencies]
tracer = ["aws-xray-sdk>=2.8.0,<3.0.0"]
validation = ["fastjsonschema>=2.14.5,<3.0.0"]
parser = ["pydantic>=2.4.0,<3.0.0"]
redis = ["redis>=4.4,<8.0"]
valkey = ["valkey-glide>=1.3.5,<3.0"]
datamasking = ["aws-encryption-sdk>=3.1.1,<5.0.0", "jsonpath-ng>=1.6.0,<2.0.0"]
aws-sdk = ["boto3>=1.34.32,<2.0.0"]
datadog = ["datadog-lambda>=8.114.0,<9.0.0"]
kafka-consumer-avro = ["avro>=1.12.0,<2.0.0"]
kafka-consumer-protobuf = ["protobuf>=6.30.2,<7.0.0"]
all = [
  "pydantic>=2.4.0,<3.0.0",
  "pydantic-settings>=2.6.1,<3.0.0",
  "aws-xray-sdk>=2.8.0,<3.0.0",
  "fastjsonschema>=2.14.5,<3.0.0",
  "aws-encryption-sdk>=3.1.1,<5.0.0",
  "jsonpath-ng>=1.6.0,<2.0.0",
]

[project.urls]
Homepage = "https://github.com/aws-powertools/powertools-lambda-python"
Documentation = "https://docs.powertools.aws.dev/lambda/python/"
Repository = "https://github.com/aws-powertools/powertools-lambda-python"
"Issue tracker" = "https://github.com/aws-powertools/powertools-lambda-python/issues"
Releases = "https://github.com/aws-powertools/powertools-lambda-python/releases"

[dependency-groups]
dev = [
  "coverage[toml]>=7.6,<8.0",
  "pytest>=8.3.4,<10.0.0",
  "boto3>=1.26.164,<2.0.0",
  "isort>=5.13.2,<8.0.0",
  "pytest-cov>=5,<8",
  "pytest-mock>=3.14.0,<4.0.0",
  "pytest-asyncio>=0.24,<1.4",
  "bandit>=1.7.10,<2.0.0",
  "radon>=6.0.1,<7.0.0",
  "xenon>=0.9.3,<1.0.0",
  "mkdocs-git-revision-date-plugin>=0.3.2,<1.0.0",
  "pytest-xdist>=3.6.1,<4.0.0",
  "aws-cdk-lib>=2.176.0,<3.0.0",
  "aws-cdk.aws-apigatewayv2-alpha>=2.38.1a0,<3.0.0",
  "aws-cdk.aws-apigatewayv2-integrations-alpha>=2.38.1a0,<3.0.0",
  "aws-cdk.aws-apigatewayv2-authorizers-alpha>=2.38.1a0,<3.0.0",
  "aws-cdk.aws-lambda-python-alpha>=2.176.0a0,<3.0.0",
  "cdklabs.generative-ai-cdk-constructs>=0.1.289,<1.0.0",
  "pytest-benchmark>=4,<6",
  "types-requests>=2.31.0,<3.0.0",
  "typing-extensions>=4.12.2,<5.0.0",
  "mkdocs-material>=9.5.50,<10.0.0",
  "filelock>=3.16.0,<4.0.0",
  "dirhash>=0.5.0,<1.0.0",
  "mypy-boto3-appconfigdata>=1.36.0,<2.0.0",
  "ijson>=3.3.0,<4.0.0",
  "hvac>=2.3.0,<3.0.0",
  "aws-requests-auth>=0.4.3,<1.0.0",
  "urllib3>=1.25.4,!=2.2.0,<3",
  "requests>=2.32.0,<3.0.0",
  "cfn-lint==1.43.2",
  "mypy>=1.1.1,<2.0.0",
  "types-python-dateutil>=2.8.19.6,<3.0.0",
  "aws-cdk-aws-appsync-alpha>=2.59.0a0,<3.0.0",
  "httpx>=0.23.3,<0.29.0",
  "sentry-sdk>=1.22.2,<3.0.0",
  "ruff>=0.5.1,<0.14.11",
  "retry2>=0.9.5,<1.0.0",
  "pytest-socket>=0.6,<0.8",
  "types-redis>=4.6.0.7,<5.0.0",
  "testcontainers[redis]>=3.7.1,<5.0.0",
  "multiprocess>=0.70.16,<1.0.0",
  "boto3-stubs[appconfig,appconfigdata,cloudformation,cloudwatch,dynamodb,lambda,logs,s3,secretsmanager,ssm,xray]>=1.34.139,<2.0.0",
  "nox>=2024.4.15,<2026.0.0",
  "mkdocstrings-python>=1.13.0,<2.0.0",
  "mkdocs-llmstxt>=0.2,<0.5",
  "avro>=1.12.0,<2.0.0",
  "protobuf>=6.30.2,<7.0.0",
  "types-protobuf>=6.30.2.20250516,<7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aws_lambda_powertools"]

[tool.hatch.build.targets.sdist]
include = [
  "aws_lambda_powertools/**",
  "aws_lambda_powertools/py.typed",
  "THIRD-PARTY-LICENSES",
]

[tool.coverage.run]
source = ["aws_lambda_powertools"]
omit = [
  "tests/*",
  "aws_lambda_powertools/exceptions/*",
  "aws_lambda_powertools/utilities/parser/types.py",
  "aws_lambda_powertools/utilities/jmespath_utils/envelopes.py",
  "aws_lambda_powertools/metrics/metric.py",
]
branch = true

[tool.coverage.html]
directory = "test_report"
title = "Powertools for AWS Lambda (Python) Test Coverage"

[tool.coverage.report]
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "if self.debug",
  "raise AssertionError",
  "raise NotImplementedError",
  "if 0:",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "@overload",
]

[tool.isort]
profile = "black"
skip = "example"

[tool.black]
line-length = 120
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | aws_lambda_powertools/event_handler/openapi/compat.py
  )/
  | example
)
'''

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -vv"
testpaths = "./tests"
markers = [
  "perf: marks perf tests to be deselected (deselect with '-m \"not perf\"')",
]
