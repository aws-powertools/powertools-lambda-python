[project]
name = "aws_lambda_powertools"
version = "3.35.0"
description = "Powertools for AWS Lambda (Python) is a developer toolkit to implement Serverless best practices and increase developer velocity."
requires-python = ">=3.10,<4.0.0"
authors = [{name = "Amazon Web Services"}]
readme = "README.md"
keywords = [
  "aws_lambda_powertools",
  "aws",
  "tracing",
  "logging",
  "lambda",
  "powertools",
  "feature_flags",
  "idempotency",
  "middleware",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "License :: OSI Approved :: MIT No Attribution License (MIT-0)",
  "Natural Language :: English",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
]
dependencies = [
    "jmespath (>=1.0.1,<2.0.0)",
    "typing-extensions (>=4.11.0,<5.0.0)",
]

[project.license]
text = "MIT"

[project.urls]
Repository = "https://github.com/aws-powertools/powertools-lambda-python"
Documentation = "https://docs.powertools.aws.dev/lambda/python/"
"Issue tracker" = "https://github.com/aws-powertools/powertools-lambda-python/issues"
Releases = "https://github.com/aws-powertools/powertools-lambda-python/releases"

[project.optional-dependencies]
parser = [
    "pydantic (>=2.4.0,<3.0.0)",
]
validation = [
    "fastjsonschema (>=2.14.5,<3.0.0)",
]
tracer = [
    "aws-xray-sdk (>=2.8.0,<3.0.0)",
]
redis = [
    "redis (>=4.4,<9.0)",
]
valkey = [
    "valkey-glide (>=1.3.5,<3.0)",
]
jwt = [
    "pyjwt (>=2.14.0,<3.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "urllib3 (>=2.8.0,<3.0.0)",
]
all = [
    "pydantic (>=2.4.0,<3.0.0)",
    "pydantic-settings (>=2.6.1,<3.0.0)",
    "aws-xray-sdk (>=2.8.0,<3.0.0)",
    "fastjsonschema (>=2.14.5,<3.0.0)",
    "aws-encryption-sdk (>=4.0.5,<5.0.0)",
    "jsonpath-ng (>=1.6.0,<2.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "urllib3 (>=2.8.0,<3.0.0)",
]
aws-sdk = [
    "boto3 (>=1.34.32,<2.0.0)",
]
datadog = [
    "datadog-lambda (>=8.114.0,<9.0.0)",
]
datamasking = [
    "aws-encryption-sdk (>=4.0.5,<5.0.0)",
    "jsonpath-ng (>=1.6.0,<2.0.0)",
]
kafka-consumer-avro = [
    "avro (>=1.12.0,<2.0.0)",
]
kafka-consumer-protobuf = [
    "protobuf (>=6.30.2,<8.0.0)",
