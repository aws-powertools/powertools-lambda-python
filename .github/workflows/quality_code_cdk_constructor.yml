name: Code quality - CDK constructor

# PROCESS
#
# 1. Install all dependencies and spin off containers for all supported Python versions
# 2. Run code formatters and linters (various checks) for code standard
# 3. Run static typing checker for potential bugs
# 4. Run tests

# USAGE
#
# Always triggered on new PRs, PR changes and PR merge.


on:
  pull_request:
    paths:
      - "layer_v3/layer_constructors/**"
      - "layer_v3/docker/**"
      - "layer_v3/pyproject.toml"
      - "layer_v3/uv.lock"
      - ".github/workflows/quality_code_cdk_constructor.yml"
    branches:
      - develop
  push:
    paths:
        - "layer_v3/layer_constructors/**"
        - "layer_v3/docker/**"
        - "layer_v3/pyproject.toml"
        - "layer_v3/uv.lock"
        - ".github/workflows/quality_code_cdk_constructor.yml"
    branches:
      - develop

permissions:
  contents: read

jobs:
  quality_check_cdk:
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.14"]
    env:
      PYTHON: "${{ matrix.python-version }}"
    permissions:
      contents: read  # checkout code only
    defaults:
      run:
        working-directory: ./layer_v3/layer_constructors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.19"
          enable-cache: true
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64
        # NOTE: we need QEMU to build Layer against a different architecture (e.g., ARM)
      - name: Set up Docker Buildx
        id: builder
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker
          platforms: linux/amd64,linux/arm64
      - name: Install dependencies
        run: uv sync --locked --no-build
      - name: Test with pytest
        run: uv run --locked --no-build pytest tests
        env:
          BUILDX_BUILDER: ${{ steps.builder.outputs.name }}
