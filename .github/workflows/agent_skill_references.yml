name: Regenerate agent skill references

# PROCESS
#
# 1. Runs on every push to develop that touches the docs, the examples or the generator
# 2. Regenerates .agents/skills/*/references from the docs
# 3. Opens a PR with the result when anything changed; duplicates with the same title are closed by the action
#
# This keeps contributors out of it: a docs PR changes docs, the references catch up after the merge.

on:
  push:
    branches:
      - develop
    paths:
      - "docs/**"
      - "examples/**"
      - "scripts/build_agent_skill_references.py"
  workflow_dispatch: {}

env:
  TEMP_BRANCH_PREFIX: "ci-agent-skill"
  PULL_REQUEST_TITLE: "chore(docs): regenerate the agent skill references"
  FILES_TO_COMMIT: ".agents/skills/building-lambda-functions-with-powertools-python/references"

permissions:
  contents: read

jobs:
  regenerate:
    if: github.repository == 'aws-powertools/powertools-lambda-python'
    concurrency:
      group: agent-skill-references
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create temporary branch with the references
      pull-requests: write  # create PR
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Regenerate references
        run: python3 scripts/build_agent_skill_references.py
      - name: Create PR
        id: create-pr
        uses: ./.github/actions/create-pr
        with:
          files: ${{ env.FILES_TO_COMMIT }}
          temp_branch_prefix: ${{ env.TEMP_BRANCH_PREFIX }}
          pull_request_title: ${{ env.PULL_REQUEST_TITLE }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
