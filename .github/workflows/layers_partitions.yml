# Partitioned Layer Publish
# ---
# This workflow publishes a specific layer version in an AWS account based on the environment input.
#
# We pull each the version of the layer and store them as artifacts, the we upload them to each of the Partitioned AWS accounts.
#
# Every target publication is preflighted against the latest version already present in the partition, so a partially
# failed run can be rerun safely: existing versions are verified instead of republished.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        type: choice
        options:
          - Gamma
          - Prod
        required: true
      version:
        description: Layer version to duplicate
        type: string
        required: true
      partition:
        description: Partition to deploy to
        type: choice
        options:
          - China
          - GovCloud
        required: true
  workflow_call:
    inputs:
      environment:
        description: Deployment environment
        type: string
        required: true
      version:
        description: Layer version to duplicate
        type: string
        required: true
      partition:
        description: Partition to deploy to
        type: string
        required: true

name: Layer Deployment (Partitions)
run-name: Layer Deployment (${{ inputs.partition }}) - ${{ inputs.environment }} / Version - ${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: layer-balancer-${{ inputs.partition }}-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ format('{0}{1}', steps.regions_china.outputs.regions, steps.regions_govcloud.outputs.regions) }}
      partition: ${{ format('{0}{1}', steps.regions_china.outputs.partition, steps.regions_govcloud.outputs.partition) }}
      aud: ${{ format('{0}{1}', steps.regions_china.outputs.aud, steps.regions_govcloud.outputs.aud) }}
      version: ${{ steps.inputs.outputs.version }}
    steps:
      - id: inputs
        name: Validate inputs
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          PARTITION: ${{ inputs.partition }}
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$ENVIRONMENT" != "Gamma" ]] && [[ "$ENVIRONMENT" != "Prod" ]]; then
            echo "environment must be Gamma or Prod"
            exit 1
          fi

          if [[ "$PARTITION" != "China" ]] && [[ "$PARTITION" != "GovCloud" ]]; then
            echo "partition must be China or GovCloud"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^[1-9][0-9]*$ ]]; then
            echo "version must be a positive integer"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - id: regions_china
        name: Partition (China)
        if: ${{ inputs.partition == 'China' }}
        run: |
          {
            echo 'regions=["cn-north-1"]'
            echo 'partition=aws-cn'
            echo 'aud=sts.amazonaws.com.cn'
          } >> "$GITHUB_OUTPUT"
      - id: regions_govcloud
        name: Partition (GovCloud)
        if: ${{ inputs.partition == 'GovCloud' }}
        run: |
          {
            echo 'regions=["us-gov-east-1","us-gov-west-1"]'
            echo 'partition=aws-us-gov'
            echo 'aud=sts.amazonaws.com'
          } >> "$GITHUB_OUTPUT"

  download:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: Prod (Readonly)
    env:
      AWS_MAX_ATTEMPTS: "10"
      AWS_RETRY_MODE: standard
    strategy:
      fail-fast: false
      matrix:
        layer:
          - AWSLambdaPowertoolsPythonV3-python310
          - AWSLambdaPowertoolsPythonV3-python311
          - AWSLambdaPowertoolsPythonV3-python312
          - AWSLambdaPowertoolsPythonV3-python313
          - AWSLambdaPowertoolsPythonV3-python314
        arch:
          - arm64
          - x86_64
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: Grab Zip
        env:
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          aws --region us-east-1 lambda get-layer-version-by-arn \
            --arn "arn:aws:lambda:us-east-1:017000801446:layer:${LAYER_NAME}:${VERSION}" > "${LAYER_NAME}.json"

          LOCATION=$(jq -r '.Content.Location' "${LAYER_NAME}.json")
          curl --fail --location --retry 3 --retry-delay 2 --output "${LAYER_NAME}.zip" "$LOCATION"
      - name: Grab Policy
        env:
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          if ! aws --region us-east-1 lambda get-layer-version-policy \
            --layer-name "arn:aws:lambda:us-east-1:017000801446:layer:${LAYER_NAME}" \
            --version-number "$VERSION" > "${LAYER_NAME}.policy.json" 2> policy-error.txt; then
            if grep -q ResourceNotFoundException policy-error.txt; then
              echo '{"Policy":null}' > "${LAYER_NAME}.policy.json"
            else
              cat policy-error.txt
              exit 1
            fi
          fi
      - name: Store Zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.zip
          path: ${{ matrix.layer }}-${{ matrix.arch }}.zip
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Store Metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.json
          path: ${{ matrix.layer }}-${{ matrix.arch }}.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true
      - name: Store Policy
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.policy.json
          path: ${{ matrix.layer }}-${{ matrix.arch }}.policy.json
          retention-days: 1
          if-no-files-found: error
          overwrite: true

  copy:
    name: Copy
    needs:
      - setup
      - download
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    # Environment should interperlate as "GovCloud Prod" or "China Beta"
    environment: ${{ inputs.partition }} ${{ inputs.environment }}
    env:
      AWS_MAX_ATTEMPTS: "10"
      AWS_RETRY_MODE: standard
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(needs.setup.outputs.regions) }}
        layer:
          - AWSLambdaPowertoolsPythonV3-python310
          - AWSLambdaPowertoolsPythonV3-python311
          - AWSLambdaPowertoolsPythonV3-python312
          - AWSLambdaPowertoolsPythonV3-python313
          - AWSLambdaPowertoolsPythonV3-python314
        arch:
          - arm64
          - x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download Zip
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.zip
      - name: Download Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.json
      - name: Download Policy
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}.policy.json
      - name: Verify Layer Signature
        env:
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
        run: |
          EXPECTED_SHA=$(jq -r '.Content.CodeSha256' "${LAYER_NAME}.json")
          ACTUAL_SHA=$(openssl dgst -sha256 -binary "${LAYER_NAME}.zip" | openssl enc -base64)
          if [[ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]]; then
            echo "SHA mismatch for ${LAYER_NAME}: expected ${EXPECTED_SHA}, received ${ACTUAL_SHA}"
            exit 1
          fi
          echo "SHA OK: ${EXPECTED_SHA}"
      - id: source_policy
        name: Source Layer Visibility
        env:
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
        run: |
          VISIBILITY=$(bash .github/scripts/layer_policy_visibility.sh "${LAYER_NAME}.policy.json")
          if [[ "$VISIBILITY" == "public" ]]; then
            echo 'public=true' >> "$GITHUB_OUTPUT"
            echo 'Commercial source layer is public'
          else
            echo 'public=false' >> "$GITHUB_OUTPUT"
            echo 'Commercial source layer is private'
          fi
      - id: region
        name: Normalize region
        env:
          REGION: ${{ matrix.region }}
        run: |
          NORMALIZED_REGION=${REGION^^}
          echo "value=${NORMALIZED_REGION//-/_}" >> "$GITHUB_OUTPUT"
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ secrets[format('IAM_ROLE_{0}', steps.region.outputs.value)] }}
          aws-region: ${{ matrix.region }}
          mask-aws-account-id: true
          audience: ${{ needs.setup.outputs.aud }}
      - name: Validate target account
        env:
          AWS_ACCOUNT: ${{ secrets[format('AWS_ACCOUNT_{0}', steps.region.outputs.value)] }}
          PARTITION: ${{ needs.setup.outputs.partition }}
          REGION: ${{ matrix.region }}
        run: |
          if [[ ! "$AWS_ACCOUNT" =~ ^[0-9]{12}$ ]]; then
            echo "AWS account secret for ${REGION} is missing or invalid"
            exit 1
          fi

          IDENTITY=$(aws --region "$REGION" sts get-caller-identity --query '[Account, Arn]' --output text)
          read -r CALLER_ACCOUNT CALLER_ARN <<< "$IDENTITY"

          if [[ "$CALLER_ACCOUNT" != "$AWS_ACCOUNT" ]] || [[ "$CALLER_ARN" != "arn:${PARTITION}:"* ]]; then
            echo "Assumed role does not match the expected account and partition for ${REGION}"
            exit 1
          fi
      - id: preflight
        name: Inspect Target Layer
        env:
          AWS_ACCOUNT: ${{ secrets[format('AWS_ACCOUNT_{0}', steps.region.outputs.value)] }}
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          PARTITION: ${{ needs.setup.outputs.partition }}
          REGION: ${{ matrix.region }}
          SOURCE_IS_PUBLIC: ${{ steps.source_policy.outputs.public }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p scratch

          TARGET_ARN="arn:${PARTITION}:lambda:${REGION}:${AWS_ACCOUNT}:layer:${LAYER_NAME}:${VERSION}"
          TARGET_METADATA="${LAYER_NAME}-${REGION}.json"
          EXPECTED_SHA=$(jq -r '.Content.CodeSha256' "${LAYER_NAME}.json")

          if ! aws --region "$REGION" lambda list-layer-versions \
            --layer-name "$LAYER_NAME" \
            --output json > scratch/versions.json 2> scratch/list-error.txt; then
            if grep -q ResourceNotFoundException scratch/list-error.txt; then
              echo '{"LayerVersions":[]}' > scratch/versions.json
            else
              cat scratch/list-error.txt
              exit 1
            fi
          fi

          CURRENT_POSITION=$(jq -r '[.LayerVersions[]?.Version] | max // 0' scratch/versions.json)
          echo "Latest ${LAYER_NAME} version in ${REGION} is ${CURRENT_POSITION}"

          VERSION_EXISTS=false
          if aws --region "$REGION" lambda get-layer-version-by-arn \
            --arn "$TARGET_ARN" > scratch/target.json 2> scratch/get-error.txt; then
            VERSION_EXISTS=true
            cp scratch/target.json "$TARGET_METADATA"
          elif ! grep -q ResourceNotFoundException scratch/get-error.txt; then
            cat scratch/get-error.txt
            exit 1
          fi

          TARGET_IS_PUBLIC=false

          if [[ "$VERSION_EXISTS" == "true" ]]; then
            TARGET_SHA=$(jq -r '.Content.CodeSha256' "$TARGET_METADATA")
            if [[ "$TARGET_SHA" != "$EXPECTED_SHA" ]]; then
              echo "Existing ${LAYER_NAME}:${VERSION} in ${REGION} has SHA ${TARGET_SHA}, expected ${EXPECTED_SHA}"
              exit 1
            fi
            echo "${LAYER_NAME}:${VERSION} already exists in ${REGION} with the expected SHA"

            if ! aws --region "$REGION" lambda get-layer-version-policy \
              --layer-name "$LAYER_NAME" \
              --version-number "$VERSION" > scratch/policy.json 2> scratch/policy-error.txt; then
              if grep -q ResourceNotFoundException scratch/policy-error.txt; then
                echo '{"Policy":null}' > scratch/policy.json
              else
                cat scratch/policy-error.txt
                exit 1
              fi
            fi

            TARGET_VISIBILITY=$(bash .github/scripts/layer_policy_visibility.sh scratch/policy.json)
            if [[ "$TARGET_VISIBILITY" == "public" ]]; then
              TARGET_IS_PUBLIC=true
            fi

            if [[ "$SOURCE_IS_PUBLIC" == "false" ]] && [[ "$TARGET_IS_PUBLIC" == "true" ]]; then
              echo "${LAYER_NAME}:${VERSION} in ${REGION} is public but its commercial source is private"
              exit 1
            fi
          else
            EXPECTED_POSITION=$((VERSION - 1))
            if (( CURRENT_POSITION != EXPECTED_POSITION )); then
              echo "Cannot publish ${LAYER_NAME}:${VERSION} in ${REGION}: latest version is ${CURRENT_POSITION}, expected ${EXPECTED_POSITION}"
              exit 1
            fi
          fi

          echo "exists=$VERSION_EXISTS" >> "$GITHUB_OUTPUT"
          echo "public=$TARGET_IS_PUBLIC" >> "$GITHUB_OUTPUT"
      - name: Create Layer
        if: ${{ steps.preflight.outputs.exists == 'false' }}
        env:
          AWS_MAX_ATTEMPTS: "1"
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          REGION: ${{ matrix.region }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p scratch
          TARGET_METADATA="${LAYER_NAME}-${REGION}.json"

          jq --arg layer_name "$LAYER_NAME" \
            '{LayerName: $layer_name, Description: .Description, CompatibleRuntimes: .CompatibleRuntimes, CompatibleArchitectures: .CompatibleArchitectures, LicenseInfo: .LicenseInfo} | with_entries(select(.value != null))' \
            "${LAYER_NAME}.json" > input.json

          aws --region "$REGION" lambda publish-layer-version \
            --zip-file "fileb://./${LAYER_NAME}.zip" \
            --cli-input-json file://./input.json > scratch/published.json

          cp scratch/published.json "$TARGET_METADATA"

          PUBLISHED_VERSION=$(jq -r '.Version' "$TARGET_METADATA")

          if (( PUBLISHED_VERSION != VERSION )); then
            echo "Expected ${LAYER_NAME} to publish as version ${VERSION} in ${REGION}, received ${PUBLISHED_VERSION}"
            exit 1
          fi

          echo "Published ${LAYER_NAME}:${PUBLISHED_VERSION} to ${REGION}"
      - name: Add Public Permission
        if: ${{ steps.source_policy.outputs.public == 'true' && steps.preflight.outputs.public == 'false' }}
        env:
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          REGION: ${{ matrix.region }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p scratch

          if ! aws --region "$REGION" lambda add-layer-version-permission \
            --layer-name "$LAYER_NAME" \
            --statement-id PublicLayer \
            --action lambda:GetLayerVersion \
            --principal '*' \
            --version-number "$VERSION" 2> scratch/permission-error.txt; then
            if ! grep -q ResourceConflictException scratch/permission-error.txt; then
              cat scratch/permission-error.txt
              exit 1
            fi
            echo "Public permission already present on ${LAYER_NAME}:${VERSION} in ${REGION}"
          fi
      - name: Verify Layer
        env:
          AWS_ACCOUNT: ${{ secrets[format('AWS_ACCOUNT_{0}', steps.region.outputs.value)] }}
          LAYER_NAME: ${{ matrix.layer }}-${{ matrix.arch }}
          PARTITION: ${{ needs.setup.outputs.partition }}
          REGION: ${{ matrix.region }}
          SOURCE_IS_PUBLIC: ${{ steps.source_policy.outputs.public }}
          VERSION: ${{ needs.setup.outputs.version }}
        run: |
          mkdir -p scratch

          TARGET_ARN="arn:${PARTITION}:lambda:${REGION}:${AWS_ACCOUNT}:layer:${LAYER_NAME}:${VERSION}"
          TARGET_METADATA="${LAYER_NAME}-${REGION}.json"

          aws --region "$REGION" lambda get-layer-version-by-arn \
            --arn "$TARGET_ARN" > scratch/target.json
          cp scratch/target.json "$TARGET_METADATA"

          EXPECTED_SHA=$(jq -r '.Content.CodeSha256' "${LAYER_NAME}.json")
          TARGET_SHA=$(jq -r '.Content.CodeSha256' "$TARGET_METADATA")
          if [[ "$TARGET_SHA" != "$EXPECTED_SHA" ]]; then
            echo "${LAYER_NAME}:${VERSION} in ${REGION} has SHA ${TARGET_SHA}, expected ${EXPECTED_SHA}"
            exit 1
          fi
          echo "SHA OK: ${EXPECTED_SHA}"

          jq -s -r '["Layer Arn", "Runtimes", "Version", "Description", "SHA256"], (.[] | [.LayerArn, (.CompatibleRuntimes | join("/")), .Version, .Description, .Content.CodeSha256]) | @tsv' \
            "${LAYER_NAME}.json" "$TARGET_METADATA" | column -t -s $'\t'

          if ! aws --region "$REGION" lambda get-layer-version-policy \
            --layer-name "$LAYER_NAME" \
            --version-number "$VERSION" > scratch/policy.json 2> scratch/policy-error.txt; then
            if grep -q ResourceNotFoundException scratch/policy-error.txt; then
              echo '{"Policy":null}' > scratch/policy.json
            else
              cat scratch/policy-error.txt
              exit 1
            fi
          fi

          TARGET_IS_PUBLIC=false
          TARGET_VISIBILITY=$(bash .github/scripts/layer_policy_visibility.sh scratch/policy.json)
          if [[ "$TARGET_VISIBILITY" == "public" ]]; then
            TARGET_IS_PUBLIC=true
          fi

          if [[ "$TARGET_IS_PUBLIC" != "$SOURCE_IS_PUBLIC" ]]; then
            echo "${LAYER_NAME}:${VERSION} in ${REGION} does not match its commercial source visibility"
            exit 1
          fi
      - name: Store Metadata - ${{ matrix.region }}
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.layer }}-${{ matrix.arch }}-${{ matrix.region }}.json
          path: ${{ matrix.layer }}-${{ matrix.arch }}-${{ matrix.region }}.json
          retention-days: 1
          if-no-files-found: warn
          overwrite: true
