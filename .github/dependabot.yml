version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "boto3"
    groups:
      boto-typing:
        patterns:
          - "mypy-boto3-*"
      dev-dependencies:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "black"
          - "coverage"
          - "flake8*"
          - "pre-commit"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: "develop"
    commit-message:
      prefix: chore
      include: scope
    allow:
      - dependency-name: "aws-cdk*"
    groups:
      aws-cdk:
        patterns:
          - "aws-cdk*"

  - package-ecosystem: pip
    directory: /benchmark/src/instrumented
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /benchmark/src/reference
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /docs
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly

  - package-ecosystem: pip
    directory: /docs
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: weekly
      day: "monday"
    groups:
      docs-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /examples/event_handler_graphql/src
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly

  - package-ecosystem: gomod
    directory: /layer/scripts/layer-balancer
    commit-message:
      prefix: chore
      include: scope
    schedule:
      interval: monthly
    groups:
      layer-balancer:
        patterns:
          - "*"
