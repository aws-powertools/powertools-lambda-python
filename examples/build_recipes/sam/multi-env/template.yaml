AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Log level for Lambda functions

Mappings:
  EnvironmentMap:
    dev:
      MemorySize: 256
      Timeout: 30
    staging:
      MemorySize: 512
      Timeout: 60
    prod:
      MemorySize: 1024
      Timeout: 120

Globals:
  Function:
    Runtime: python3.13
    MemorySize: !FindInMap [EnvironmentMap, !Ref Environment, MemorySize]
    Timeout: !FindInMap [EnvironmentMap, !Ref Environment, Timeout]
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        POWERTOOLS_SERVICE_NAME: !Sub "${AWS::StackName}-${Environment}"
        POWERTOOLS_METRICS_NAMESPACE: !Sub "MyApp/${Environment}"
        POWERTOOLS_LOG_LEVEL: !Ref LogLevel
        POWERTOOLS_DEV: !If [IsDev, "true", "false"]

Conditions:
  IsDev: !Equals [!Ref Environment, "dev"]
  IsProd: !Equals [!Ref Environment, "prod"]

Resources:
  # Dependencies Layer for application dependencies
  DependenciesLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: !Sub "${AWS::StackName}-${Environment}-dependencies"
      Description: !Sub "Application dependencies for ${Environment}"
      ContentUri: layers/dependencies/
      CompatibleRuntimes:
        - python3.13
      RetentionPolicy: Delete

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: app.lambda_handler
      Layers:
        - arn:aws:lambda:us-east-1:017000801446:layer:AWSLambdaPowertoolsPythonV3-python313-x86_64:32
        - !Ref DependenciesLayer
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
      Environment:
        Variables:
          TABLE_NAME: !Ref DynamoTable

  DynamoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-${Environment}-data"
      BillingMode: !If [IsProd, "PROVISIONED", "PAY_PER_REQUEST"]
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      ProvisionedThroughput: !If
        - IsProd
        - ReadCapacityUnits: 5
          WriteCapacityUnits: 5
        - !Ref AWS::NoValue
