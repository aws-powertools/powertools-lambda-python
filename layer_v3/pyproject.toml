[project]
name = "aws-lambda-powertools-python-layer"
version = "3.0.0"
description = "Powertools for AWS Lambda (Python) Lambda Layers"
authors = [{ name = "Powertools for AWS Maintainers", email = "aws-powertools-maintainers@amazon.com" }]
license = "MIT"
requires-python = ">=3.10"

dependencies = [
  "aws-cdk-lib>=2.223.0,<3.0.0",
]

[dependency-groups]
dev = [
  "pytest>=7.1.2,<8.0.0",
  "boto3>=1.24.46,<2.0.0",
  "urllib3>=1.25.4,!=2.2.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
